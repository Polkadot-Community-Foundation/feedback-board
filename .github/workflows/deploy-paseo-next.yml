name: Deploy to devnet

# Production deploy of the Feedback Board frontend to Summit (Bulletin Chain + DotNS).
#
# Summit-only, production-only by design: on Summit every preview domain would be
# a fresh DotNS registration (~SUM gas + Bulletin storage that expires in ~14 days
# + a proof-of-personhood gate on short labels), so there are NO per-PR preview
# deploys. PR validation lives in ci.yml (typecheck + build). This job runs on
# push to main and on manual dispatch, and always targets the single production
# domain `feedback.dot`.
#
# Deploy CLI: @polkadot-community-foundation/polkadot-app-deploy@0.16.6 — it ships
# the devnet DotNS v0.8.0 addresses (older CLIs bind names in abandoned sets),
# the built-in `summit` env (RPCs + DotNS addresses + summit-ipfs gateway), the
# manifest direct-signer fix, AND the Summit Publisher address
# (0xf5fe0fc9f4c13dfd3a4a8abd27e64eb652157494) wired in, which `--publish` needs.
# Installed + run inline (NOT the @parity-scoped reusable workflow, which pins a
# @parity/polkadot-app-deploy version that is not published). Flags mirror the
# proven browse / festival path: --mnemonic (direct signer, never --suri),
# --config, --js-merkle, and --publish so feedback.dot lists in the `browse`
# app-directory. The deploy signer (5Fk8) is the Publisher's OWNER, so publishing
# carries no proof-of-personhood gate and no rate limit for any `.dot` it owns.
#
# The contract leg (`@polkadot/feedback` via `cdm deploy -n w3s`) is a one-time,
# greenfield, manually-signed step on the operator VM — see DEPLOY_SUMMIT.md. CI
# only ships the SPA; the SPA live-resolves the contract address from the on-chain
# CDM registry at boot, so a frontend redeploy needs no new contract.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'cdm.json'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'assets/**'
      - 'polkadot-app-deploy.config.ts'
      - '.github/workflows/deploy-paseo-next.yml'
  workflow_dispatch:

concurrency:
  group: deploy-paseo-next-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to devnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_NETWORK: devnet

      - name: Assert the bundle targets devnet
        run: |
          # VITE_NETWORK folds the unselected network's metadata chunk out of the
          # bundle, so the devnet Asset Hub genesis must be present and the
          # paseo-next one absent.
          if ! grep -raIl 'd6eec26135305a8ad257a20d003357284c8aa03d0bdb2b357ab0a22371e11ef2' dist >/dev/null; then
            echo "::error::devnet Asset Hub genesis missing from bundle"
            exit 1
          fi
          echo "OK: bundle targets the devnet Asset Hub"

      - name: Install deploy tool
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.16.6

      - name: Deploy to devnet Bulletin + bind feedback.dot
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          # --mnemonic (direct signer; NEVER --suri — that rides the unauthorized
          # public pool and fails on Summit Bulletin). --config: the product
          # manifest (icon/name). --js-merkle: skip the Kubo download. --publish:
          # call Summit's Publisher.publish(feedback.dot) so the app lists in the
          # `browse` app-directory (CLI 0.11.1+ wires the Summit Publisher; the
          # signer 5Fk8 is its owner → no PoP gate, no rate limit). feedback.dot
          # must already be owned by the signer (8-char label is PoP-gated →
          # pre-registered via registerReserved; see DEPLOY_SUMMIT.md). The tool
          # then sees `already-owned-by-us`.
          command: >
            polkadot-app-deploy
            --env devnet
            --mnemonic "$MNEMONIC"
            --config ./polkadot-app-deploy.config.ts
            --js-merkle
            --publish
            --no-transfer-to-signedin-user
            ./dist feedback.dot
        env:
          # Summit Bulletin-authorized uploader / DotNS owner of feedback.dot (5Fk8,
          # the canonical W3S publisher). Set in repo secrets before the first deploy.
          MNEMONIC: ${{ secrets.SUMMIT_DEPLOYER_KEY }}
